name: Lint

# Kör på varje push och pull request mot main.
# Statisk kontroll – ingen Android/Termux-miljö krävs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash-syntax och ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Samla Bash-skript
        id: collect
        run: |
          # Alla .sh plus den utökningslösa dispatchern nht.
          mapfile -t files < <(find . -name '*.sh' -not -path './.dev-tools/*' | sort)
          files+=("./nht")
          printf '%s\n' "${files[@]}" > /tmp/shell-files.txt
          echo "Hittade ${#files[@]} skript:"
          cat /tmp/shell-files.txt

      - name: Syntaxkontroll (bash -n)
        run: |
          status=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done < /tmp/shell-files.txt
          exit "$status"

      - name: ShellCheck
        run: |
          shellcheck --version
          # Felnivå: blockerar genuina fel, inte stilvarningar.
          # Finjustering via .shellcheckrc i repo-roten.
          xargs -a /tmp/shell-files.txt shellcheck --severity=error --shell=bash

  python:
    name: Python-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kompileringskontroll (py_compile)
        run: |
          mapfile -t pyfiles < <(find tools -name '*.py' | sort)
          echo "Kontrollerar ${#pyfiles[@]} Python-filer:"
          printf '%s\n' "${pyfiles[@]}"
          python -m py_compile "${pyfiles[@]}"
          echo "Python-syntax OK"
