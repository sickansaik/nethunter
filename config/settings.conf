###############################################################################
# NetHunter Toolkit
# Global Settings
###############################################################################

# Backup retention
KEEP_BACKUPS=5
KEEP_PRE_RESTORE=2

# X11
# Must match the runtime display (lib/runtime.sh RUNTIME_X11_DISPLAY),
# otherwise the menu header shows a display the Toolkit never uses.
DEFAULT_DISPLAY="127.0.0.1:1"

# Toolkit behaviour
AUTO_REPAIR=false
AUTO_UPDATE=false

###############################################################################
# Update Engine
###############################################################################

UPDATE_ENABLED=true
UPDATE_SOURCE="local"
UPDATE_REQUIRE_BACKUP=true
UPDATE_VERIFY=true
UPDATE_ROLLBACK=true
